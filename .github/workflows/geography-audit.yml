name: Geography audit baseline

on:
  push:
    branches:
      - audit/tectonic-baseline-20261114
    paths:
      - 'v2/tools/audit-geography.mjs'
      - '.github/workflows/geography-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cells: [20000, 40000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependency for the sphere mesh
        run: npm install --no-save --no-package-lock delaunator
      - name: Syntax check
        run: node --check v2/tools/audit-geography.mjs
      - name: Run baseline for three seeds
        run: node v2/tools/audit-geography.mjs --cells=${{ matrix.cells }} --seeds=12345,4242,31337 --until=1200 --every=100 --out=reports/geography-${{ matrix.cells }}
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-audit-${{ matrix.cells }}
          path: |
            reports/geography-${{ matrix.cells }}.csv
            reports/geography-${{ matrix.cells }}.json
          if-no-files-found: warn
