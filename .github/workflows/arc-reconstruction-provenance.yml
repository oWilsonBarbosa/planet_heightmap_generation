name: ARC reconstruction provenance A-B

on:
  push:
    branches: [audit/arc-reconstruction-provenance-20261115]
    paths:
      - '.github/workflows/arc-reconstruction-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ARC reconstruction / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GPE2 20K
            strength: '2.0'
            cells: 20000
          - label: GPE2 40K
            strength: '2.0'
            cells: 40000
          - label: GPE1 20K
            strength: '1.0'
            cells: 20000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arc-crust-flux-ledger-20261115
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: audit/arc-reconstruction-provenance-20261115
          path: provenance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          (cd baseline && npm install --no-save --no-package-lock delaunator)
          (cd provenance && npm install --no-save --no-package-lock delaunator)
      - name: Syntax
        run: |
          node --check provenance/v2/tools/audit-arc-fate.mjs
          node --check provenance/v2/js/tectonics/ops/merge-plates.js
          node --check provenance/v2/js/tectonics/ops/accrete-terrane.js
          node --check provenance/v2/js/tectonics/step/wings.js
      - name: Run identical 1200 Myr histories
        run: |
          mkdir -p results
          cp provenance/v2/tools/audit-arc-fate.mjs baseline/v2/tools/audit-arc-fate.mjs
          (cd baseline && node v2/tools/audit-arc-fate.mjs --seed=4242 --cells=${{ matrix.cells }} --strength=${{ matrix.strength }} --maturation-rate=3 --until=1200 --every=100 --targets=900,1000,1100,1200 --out=../results/baseline) > results/baseline.log
          (cd provenance && node v2/tools/audit-arc-fate.mjs --seed=4242 --cells=${{ matrix.cells }} --strength=${{ matrix.strength }} --maturation-rate=3 --until=1200 --every=100 --targets=900,1000,1100,1200 --out=../results/provenance) > results/provenance.log
      - name: Assert pure observability and report arc stock contributions
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('results/baseline.json','utf8'));
          const b=JSON.parse(fs.readFileSync('results/provenance.json','utf8'));
          const fields=['visibleContinentalAreaMkm2','visibleArcAreaMkm2','largestVisibleArcAreaMkm2','largestArcOldAge100Mkm2','largestArcSamePlateLandReachableMkm2','totalNativeArcMkm2','totalNativeReachableMatureArcMkm2',
            'cumulativeArcMaturedCellOps','cumulativeIslandArcBuiltCellOps','cumulativeArcScrapedAbsorbedCellOps','cumulativeArcRecycledCellOps'];
          if(a.rows.length!==b.rows.length)throw Error('Mismatched snapshots');
          for(let i=0;i<a.rows.length;i++)for(const field of fields)
            if(a.rows[i][field]!==b.rows[i][field])throw Error('Observer changed '+field+' at '+a.rows[i].timeMyr+' Ma');
          const metrics=['ArcMergeEvents','ArcMergeNetCells','ArcMergeUpperWarpDeltaCells','ArcMergeLowerOverlayDeltaCells','ArcMergeHoleFillDeltaCells','ArcMergeSeaFillDeltaCells','ArcAccreteEvents','ArcAccreteTransferredCells','ArcAccreteAbsorbedCells','ArcAccreteTransferNetCells','ArcAccreteSeaFillDeltaCells','ArcWidenedAtNonOverridingCells'];
          for(const r of b.rows){
            const tel=r.cumulativeArcMergeUpperWarpDeltaCells+r.cumulativeArcMergeLowerOverlayDeltaCells+r.cumulativeArcMergeHoleFillDeltaCells+r.cumulativeArcMergeSeaFillDeltaCells;
            if(tel!==r.cumulativeArcMergeNetCells)throw Error('Merge deltas do not telescope at '+r.timeMyr);
          }
          const row=(x,i)=>Object.fromEntries(['timeMyr','visibleArcAreaMkm2','largestVisibleArcAreaMkm2','totalNativeArcMkm2',...metrics.map(y=>'cumulative'+y)].map(k=>[k,x.rows[i][k]]));
          const report={seed:b.seed,cells:b.meshCells,strength:b.strength,physicalMetricsIdentical:true,rows:b.rows.map((_,i)=>row(b,i))};
          fs.writeFileSync('results/comparison.json',JSON.stringify(report,null,2)+'\n');
          console.log('PROVENANCE '+JSON.stringify(report));
          console.log('PASS prior outputs unchanged and merge-stage accounting telescopes');
          EOF
      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-reconstruction-gpe-${{ matrix.strength }}-${{ matrix.cells }}
          path: results/
          if-no-files-found: warn

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock delaunator
      - run: node v2/tools/check-invariants.mjs
