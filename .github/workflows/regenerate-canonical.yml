name: Regenerate canonical planet

on:
  push:
    branches:
      - chatgpt/regenerate-cc2662b4
    paths:
      - 'tuning/regenerate-canonical.mjs'
      - '.github/workflows/regenerate-canonical.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/regenerate-cc2662b4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save puppeteer@24.16.0

      - name: Prepare historical generator snapshot
        run: |
          git clone --no-checkout https://github.com/oWilsonBarbosa/planet_heightmap_generation.git /tmp/orogen-old
          cd /tmp/orogen-old
          git checkout f9bb081224ee80adea5bd1bb7c012d05786c4f9f

      - name: Install comparison dependencies
        run: npm install --no-save puppeteer@24.16.0 pngjs@7.0.0

      - name: Compare historical and current global rasters
        env:
          OLD_ROOT: /tmp/orogen-old
        run: node tuning/compare-global-rasters.mjs
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cc2662b4
          path: tuning/results/global-raster-compare/
          if-no-files-found: error
