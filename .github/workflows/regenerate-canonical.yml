name: Regenerate canonical planet

on:
  push:
    branches:
      - chatgpt/regenerate-cc2662b4
    paths:
      - 'tuning/regenerate-canonical.mjs'
      - 'tuning/table5-v4.mjs'
      - 'tuning/continents-islands-coasts-v4.mjs'
      - '.github/workflows/regenerate-canonical.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/regenerate-cc2662b4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save puppeteer@24.16.0

      - name: Compute Guidebook Table 5 from v4 native mesh
        run: node tuning/table5-v4.mjs

      - name: Measure v4 continents islands and coastlines
        run: node tuning/continents-islands-coasts-v4.mjs

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cc2662b4
          path: |
            tuning/results/table5-v4-native.json
            tuning/results/continents-islands-coasts-v4.json
          if-no-files-found: error
