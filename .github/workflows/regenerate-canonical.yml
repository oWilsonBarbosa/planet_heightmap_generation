name: Regenerate canonical planet

on:
  push:
    branches:
      - chatgpt/regenerate-cc2662b4
    paths:
      - 'tuning/regenerate-canonical.mjs'
      - 'tuning/table5-v4.mjs'
      - 'tuning/continents-islands-coasts-v4.mjs'
      - 'tuning/marine-topology-v4.mjs'
      - 'tuning/major-plates-v4.mjs'
      - 'tuning/mountain-rifts-v4.mjs'
      - 'tuning/major-boundary-systems-v4.mjs'
      - 'tuning/tectonic-rasters-v4.mjs'
      - 'tuning/volcanism-v4.mjs'
      - 'tuning/mean-temperature-v4.mjs'
      - 'js/elevation.js'
      - 'js/planet-worker.js'
      - 'js/generate.js'
      - '.github/workflows/regenerate-canonical.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/regenerate-cc2662b4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Puppeteer
        run: npm install --no-save puppeteer@24.16.0

      - name: Measure and render native mean planetary temperature
        run: node tuning/mean-temperature-v4.mjs

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cc2662b4
          path: tuning/results/mean-temperature-v4/
          if-no-files-found: error
