name: Orogen connected-gorge lake drainage experiment

on:
  pull_request:
    paths:
      - 'v2/js/finish/**'
      - 'tuning/evolution/**'
      - '.github/workflows/orogen-continuous-gorge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Delaunator
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts delaunator@5.0.1
      - name: Check physically connected channel hypothesis at 640K and 1.28M
        run: |
          set -o pipefail
          node --max-old-space-size=5500 tuning/evolution/drainage.mjs --cells 640000,1280000 --glacial-site --lake-match --set requireContinuousGorgeDrainage=true 2>&1 | tee connected-gorge-experiment.log
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orogen-connected-gorge-experiment
          path: connected-gorge-experiment.log
          if-no-files-found: warn
