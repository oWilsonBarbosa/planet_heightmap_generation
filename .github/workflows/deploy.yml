name: Deploy to GitHub Pages

on:
  release:
    types: [published]

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Delete old artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      # Publish only the site: the tuning tools, plans, dev notes and lab pages stay in the repo, not on orogen.studio
      # (the climate lab page reads gitignored data and cannot work there; its JS stays — Evolution imports
      # v2/js/climate-lab/palettes.js). This edits the CI copy only.
      - name: Leave out developer files
        run: |
          rm -rf tuning plans reports research_notes v2/tools
          rm -f v2/index.html v2/lab.css v2/climate-lab.html v2/climate-lab.css v2/README.md
          rm -f CLAUDE.md HEIGHTMAP_REALISM_PLAN.md OCEAN_REWORK_PLAN.md V1_REVIEW.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
