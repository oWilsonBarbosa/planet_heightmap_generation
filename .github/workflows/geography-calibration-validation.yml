name: Geography calibration validation

on:
  push:
    branches:
      - audit/tectonic-baseline-20261114
    paths:
      - '.github/workflows/geography-calibration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 40K both-half, original three seeds
            cells: 40000
            dose: bothHalf
            seeds: '12345,4242,31337'
            suffix: 40k-bothHalf
          - label: 20K control, four new seeds
            cells: 20000
            dose: control
            seeds: '777,2026,8765,31415'
            suffix: 20k-extra-control
          - label: 20K both-half, four new seeds
            cells: 20000
            dose: bothHalf
            seeds: '777,2026,8765,31415'
            suffix: 20k-extra-bothHalf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mesh dependency
        run: npm install --no-save --no-package-lock delaunator
      - name: Check syntax
        run: node --check v2/tools/audit-geography.mjs
      - name: Simulate matched comparison
        run: node v2/tools/audit-geography.mjs --cells=${{ matrix.cells }} --seeds=${{ matrix.seeds }} --until=1200 --every=100 --dose=${{ matrix.dose }} --out=reports/${{ matrix.suffix }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orogen-geography-${{ matrix.suffix }}
          path: |
            reports/${{ matrix.suffix }}.csv
            reports/${{ matrix.suffix }}.json
          if-no-files-found: warn
