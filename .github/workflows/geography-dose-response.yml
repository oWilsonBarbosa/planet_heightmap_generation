name: Geography dose-response

on:
  push:
    branches:
      - audit/tectonic-baseline-20261114
    paths:
      - '.github/workflows/geography-dose-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dose: [arcHalf, islesHalf, bothHalf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mesh dependency
        run: npm install --no-save --no-package-lock delaunator
      - name: Check syntax
        run: node --check v2/tools/audit-geography.mjs
      - name: Run controlled 20K half-rate experiment
        run: node v2/tools/audit-geography.mjs --cells=20000 --seeds=12345,4242,31337 --until=1200 --every=100 --dose=${{ matrix.dose }} --out=reports/geography-20000-${{ matrix.dose }}
      - name: Upload CSV and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geography-dose-${{ matrix.dose }}
          path: |
            reports/geography-20000-${{ matrix.dose }}.csv
            reports/geography-20000-${{ matrix.dose }}.json
          if-no-files-found: warn
