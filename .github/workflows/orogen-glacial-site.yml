name: Orogen glacial lake site causal diagnosis

on:
  pull_request:
    paths:
      - 'tuning/evolution/**'
      - 'v2/js/finish/**'
      - '.github/workflows/orogen-glacial-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glacial-site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Delaunator
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts delaunator@5.0.1
      - name: Compare physical basin, lake retention and glacial terrain at 640K and 1.28M
        run: |
          set -o pipefail
          node --max-old-space-size=5500 tuning/evolution/drainage.mjs --cells 640000,1280000 --glacial-site --lake-match 2>&1 | tee glacial-site-diagnosis.log
      - name: Preserve site and lake lineage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orogen-glacial-site-diagnosis
          path: glacial-site-diagnosis.log
          if-no-files-found: warn
